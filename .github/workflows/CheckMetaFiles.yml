name: CheckMetaFiles

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  # unity-meta-check の PR コメント投稿に使う。PERSONAL_ACCESS_TOKEN が未設定だと空になり
  # API が 401 (Bad credentials) を返して失敗するため、組み込みのトークンにフォールバックする
  GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}

# Controls when the action will run. 
on:
  pull_request:
    branches:
      - main

jobs:
  meta-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout This Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Meta File Check (github-hosted ubuntu-latest)
        uses: DeNA/unity-meta-check@v3.0.0-beta4
        with:
          enable_junit: true
          junit_xml_path: junit.xml
          enable_pr_comment: true
          pr_comment_lang: ja
          pr_comment_send_success: true
        
      - uses: mikepenz/action-junit-report@v2
        with:
          report_paths: junit.xml
        if: always()
